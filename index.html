<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pegação Salvador · Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--red:#ff2a2a;--red-d:#a50f18;--ink:#ffeceb;--mute:#b98a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a0508 0%,#000 60%);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:28px 18px 40px;text-align:center}
.logo{width:200px;height:200px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(255,30,30,.35);animation:pulse 3.2s ease-in-out infinite}
.logo img{width:100%;height:100%;display:block}
@keyframes pulse{50%{box-shadow:0 0 90px rgba(255,30,30,.6)}}
h1{margin:18px 0 4px;font-size:1.7rem;font-weight:700;letter-spacing:.04em;text-shadow:0 0 14px var(--red)}
.bio{margin:0 auto 22px;max-width:34ch;color:var(--mute);font-size:.98rem;line-height:1.45}
h2{margin:26px 0 10px;font-size:.95rem;font-weight:700;color:var(--red);text-align:left;text-shadow:0 0 8px rgba(255,42,42,.6)}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1.5px solid var(--red);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:1.02rem;background:rgba(255,42,42,.05);box-shadow:0 0 10px rgba(255,42,42,.35),inset 0 0 10px rgba(255,42,42,.12);transition:box-shadow .2s,background .2s,transform .1s}
.link:hover,.link:focus-visible{background:rgba(255,42,42,.18);box-shadow:0 0 22px rgba(255,42,42,.7),inset 0 0 14px rgba(255,42,42,.25);outline:none}
.link:active{transform:scale(.98)}
.link i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.link span{flex:1;text-align:left}
.link img{flex:none;width:52px;height:52px;border-radius:50%;object-fit:cover;margin:-8px 0 -8px -10px;box-shadow:0 0 10px rgba(255,42,42,.6)}
.link small{color:var(--mute);font-weight:700;font-size:.72rem;max-width:40%;text-align:right;line-height:1.25}
.link .sub{display:block;font-style:normal;font-size:.62rem;color:var(--red);text-shadow:0 0 6px rgba(255,42,42,.7);letter-spacing:.04em;line-height:1.2}
.ad{margin:24px 0 0;min-height:100px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--red-d);border-radius:14px;color:var(--red-d);font-size:.8rem;position:relative}
.ad::before{content:"Publicidade";position:absolute;top:-9px;left:14px;background:#000;padding:0 6px;color:var(--mute);font-size:.7rem}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.box{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px;max-height:100%}
.box img{display:block;max-width:100%;max-height:calc(100vh - 190px);object-fit:contain;border-radius:18px;border:1.5px solid var(--red);box-shadow:0 0 30px rgba(255,42,42,.6)}
.go{display:block;width:100%;text-align:center;padding:15px;border-radius:999px;background:var(--red);color:#000;font-weight:700;font-size:1.1rem;text-decoration:none;box-shadow:0 0 24px rgba(255,42,42,.8)}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.x{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--red);background:rgba(0,0,0,.7);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
html.ok .gate{display:none}
html:not(.ok){overflow:hidden}
.gbox{width:100%;max-width:380px;text-align:center}
.gq{font-size:1.7rem;font-weight:700;line-height:1.2;text-shadow:0 0 16px var(--red)}
.gp{margin:14px 0 26px;font-size:.85rem;color:var(--mute);line-height:1.4}
.gbtns{display:flex;gap:14px}
.gbtns button{flex:1;padding:15px 0;border-radius:999px;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;border:2px solid}
.sim{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
.nao{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 18px rgba(255,42,42,.6)}
.gbtns button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ad169{aspect-ratio:16/9;min-height:0}
footer{margin-top:34px;color:var(--mute);font-size:.78rem}
@media (prefers-reduced-motion:reduce){.logo{animation:none}.link{transition:none}}
</style>
<script>try{if(localStorage.getItem('ps18')==='1')document.documentElement.classList.add('ok')}catch(e){}</script>
</head>

    <p class="gp">Ao clicar em SIM, você concorda que é maior de 18 anos.</p>
    <div class="gbtns"><button type="button" class="sim" id="yes">SIM</button><button type="button" class="nao" id="no">NÃO</button></div>
  </div>
</div>

function render(id,list){
  const box=document.getElementById(id);
  list.forEach(l=>{
    const a=document.createElement('a');
    a.className='link';a.href=l.preview?'#':l.url;a.target=l.preview?'_self':'_blank';a.rel='noopener';
    a.innerHTML=(l.img?'<img alt="">':'<i></i>')+'<span></span><small></small>';if(l.img)a.children[0].src=l.img;
    a.children[1].textContent=l.nome;if(l.sub){const e=document.createElement('em');e.className='sub';e.textContent=l.sub;a.children[1].appendChild(e);}a.children[2].textContent=l.desc||'';
    box.appendChild(a);
    if(l.preview)a.addEventListener('click',e=>{e.preventDefault();openPreview(l);});
  });
}
function openPreview(l){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="box"><button class="x" aria-label="Fechar">×</button><img alt=""><a class="go" target="_blank" rel="noopener"></a></div>';
  o.querySelector('img').src=l.preview;
  const go=o.querySelector('.go');go.href=l.url;go.textContent='Entre agora!';
  const esc=e=>{if(e.key==='Escape')close()};
  const close=()=>{o.remove();document.removeEventListener('keydown',esc)};
  o.addEventListener('click',e=>{if(e.target===o||e.target.classList.contains('x'))close()});
  go.addEventListener('click',()=>setTimeout(close,150));
  document.addEventListener('keydown',esc);
  document.body.appendChild(o);go.focus();
}
const mainEl=document.querySelector('main');
if(!document.documentElement.classList.contains('ok')){mainEl.inert=true;document.getElementById('yes').focus();}
document.getElementById('yes').addEventListener('click',()=>{try{localStorage.setItem('ps18','1')}catch(e){}document.documentElement.classList.add('ok');mainEl.inert=false;});
document.getElementById('no').addEventListener('click',()=>{location.href='https://www.google.com';});
render('redes',GRUPOS);render('grupos',REDES);
</script>
